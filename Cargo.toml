[package]
name = "home-maintenance"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
async-trait = "0.1.88"
axum = { version = "0.8.9", features = ["http2", "macros", "multipart"] }
axum-core = { version = "0.5.6", features = ["tracing"] }
base64 = { version = "0.23.0", features = ["alloc", "std"] }
chrono = { version = "0.4.45", features = ["serde", "now"] }
config = "0.15.15"
cookie = { version = "0.18.1", features = ["signed", "percent-encode", "secure", "key-expansion", "hkdf"] }
dotenvy = "0.15.7"
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
once_cell = "1.21.4"
rand = { version = "0.10.2", features = ["thread_rng"] }
reqwest = { version = "0.12.15", features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "any", "sqlite", "postgres", "uuid", "migrate", "chrono", "time", "tls-native-tls", "sqlite-bundled"] }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["macros", "formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "time", "local-time", "env-filter", "ansi"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[dev-dependencies]
tokio-test = "0.4.4"

[[bin]]
name = "home-maintenance"
path = "src/main.rs"
