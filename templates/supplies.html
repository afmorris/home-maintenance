<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Home Maintenance</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/assets">Assets</a>
      <a href="/tasks">Tasks</a>
      <a href="/log">Log</a>
      <a href="/supplies">Supplies</a>
      <a href="/locations">Locations</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    <h1>Supplies</h1>

    <form method="post" action="/supplies" class="inline-form">
      <label>Name <input type="text" name="name" required></label>
      <label>Spec <input type="text" name="spec"></label>
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    {% if supplies.is_empty() %}
      <p class="empty">No supplies yet.</p>
    {% else %}
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Spec</th>
            <th>Tasks</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for s in supplies %}
          <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.spec.as_deref().unwrap_or("") }}</td>
            <td>{{ s.task_count }}</td>
            <td>
              <form method="post" action="/supplies/{{ s.id }}/delete" class="inline-form">
                <button type="submit" class="btn btn-secondary">Delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endif %}
  </main>
</body>
</html>
