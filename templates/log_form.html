<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Home Maintenance</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/assets">Assets</a>
      <a href="/tasks">Tasks</a>
      <a href="/log">Log</a>
      <a href="/supplies">Supplies</a>
      <a href="/locations">Locations</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    <h1>{{ title }}</h1>
    <section>
      <form method="post" action="/log">
        <label>
          Asset
          <select name="asset_id">
            <option value="">None</option>
            {% for a in assets %}
            <option value="{{ a.id }}">{{ a.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Task
          <select name="task_id">
            <option value="">None</option>
            {% for t in tasks %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Kind
          <select name="kind" required>
            <option value="service">Service</option>
            <option value="repair">Repair</option>
            <option value="upgrade">Upgrade</option>
            <option value="inspection">Inspection</option>
          </select>
        </label>
        <label>Completed <input type="date" name="completed_date" required></label>
        <label>Cost (cents) <input type="number" name="cost_cents" value="0"></label>
        <label>Vendor <input type="text" name="vendor"></label>
        <label>Performed by <input type="text" name="performed_by"></label>
        <label>Notes <textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/log" class="btn btn-secondary">Cancel</a>
      </form>
    </section>
  </main>
</body>
</html>
